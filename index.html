
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory | Day 5</title>
    <link rel="stylesheet" href="style.css">
    <script src="users.js" defer></script>
</head>
<body>
    <header>
        <h1>User Directory</h1>
        <p>Explore users, their contact details, and companies.</p>
    </header>

    <main>
        <section aria-labelledby="directory-heading">
            <h2 id="directory-heading">Users</h2>

            <button id="load-users" type="button">Load Users</button>

            <p id="status" role="status" aria-live="polite">
                Click "Load Users" to retrieve users from the server.
            </p>

            <label for="filter-input">Filter users by name:</label>
            <input
                type="search"
                id="filter-input"
                placeholder="Enter a name..."
                autocomplete="off"
            >

            <ul id="users-list"></ul>
        </section>
    </main>
</body>
</html>
